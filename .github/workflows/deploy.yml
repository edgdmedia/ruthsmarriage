name: CI + Deploy

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Type-check, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Deploys to VPS on every push to main (after CI passes).
  # Skipped on pull requests — secrets are not available to fork workflows.
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: ci
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ruthsmarriage
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
          # The forced command in authorized_keys limits this key to exactly
          # one command: bash scripts/deploy-vps.sh
          # No sudo, no shell, no port forward — only what the deploy script needs.
          command: |
            cd /home/ruthsmarriage/app
            bash scripts/deploy-vps.sh
