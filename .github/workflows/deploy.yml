name: CI + Deploy

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: read    # needed for the "Check CI passed" step

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on: dev pushes + PRs to main.
  # Skipped on direct main pushes — deploy handles those.
  ci:
    name: Type-check, test & build
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Deploys to VPS on direct push to main (after CI passed on dev).
  # Skipped on PRs — secrets not available to fork workflows.
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      # Require a passing CI check on the commit that was merged into main.
      # A PR merge commit's second parent is the dev commit CI ran on; a
      # fast-forward push is that commit itself.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check CI passed on the merged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git rev-parse --verify -q HEAD^2 >/dev/null; then
            CHECKED_SHA=$(git rev-parse HEAD^2)
          else
            CHECKED_SHA=$(git rev-parse HEAD)
          fi
          echo "main: $(git rev-parse HEAD)  checked commit: $CHECKED_SHA"
          # Actions jobs report as check runs, not commit statuses.
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CHECKED_SHA/check-runs?check_name=Type-check,%20test%20%26%20build" \
            --jq '[.check_runs[].conclusion] | if index("success") then "success" else (first // "missing") end')
          echo "CI conclusion: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "CI has not passed on $CHECKED_SHA — refusing to deploy"
            exit 1
          fi

      # Write SSH key and known_hosts, then connect.
      # The server's forced command runs scripts/deploy-vps.sh and nothing else.
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -v -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              ruthsmarriage@"$HOST"
