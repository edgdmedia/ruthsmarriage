name: CI + Deploy

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read   # needed for the "Require a passing check on dev" step

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on: dev pushes + PRs to main.
  # Skipped on direct main pushes — deploy handles those.
  ci:
    name: Type-check, test & build
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Deploys to VPS on direct push to main (after CI passed on dev).
  # Skipped on PRs — secrets not available to fork workflows.
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      # Require a passing check on dev before deploying (AbilityX pattern).
      # Finds the dev commit whose tree == this main commit, checks its status.
      - name: Require a passing check on dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false
        id: dev_checkout

      - name: Check dev CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_SHA: ${{ github.event.after }}
        run: |
          DEV_SHA=$(git rev-parse HEAD)
          echo "dev SHA: $DEV_SHA  main SHA: $MAIN_SHA"
          if ! git merge-base --is-ancestor "$DEV_SHA" "$MAIN_SHA"; then
            echo "main contains commits never checked on dev — refusing to deploy"
            exit 1
          fi
          status=$(curl -s -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$DEV_SHA/status")
          state=$(echo "$status" | python3 -c "import sys,json; print(json.load(sys.stdin)['state'])")
          echo "dev commit state: $state"
          if [ "$state" != "success" ]; then
            echo "dev CI has not passed — refusing to deploy"
            exit 1
          fi

      # Write SSH key and known_hosts, then connect.
      # The server's forced command runs scripts/deploy-vps.sh and nothing else.
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=acceptnew \
              ruthsmarriage@"$HOST"
