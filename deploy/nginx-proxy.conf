# nginx — the Ruth's Marriage Node app, behind Cloudflare.
#
# Install as /etc/nginx/conf.d/ruthsmarriage-node.conf (a file of our own:
# Virtualmin manages sites-enabled/ruthsmarriage.com.conf, the old WordPress
# vhost, and must not be edited). conf.d/ is included at http{} level.
#
# Serves ruthsmarriage.com (the main address), www.ruthsmarriage.com (301 to
# the apex) and vps.ruthsmarriage.com (staging). conf.d/ is included before
# sites-enabled/, so this file wins the duplicate server_name over
# Virtualmin's WordPress vhost, which is left alone ("conflicting server
# name ... ignored" warnings are expected). Rollback: remove the apex and
# www from server_name below, nginx -t, reload.
#
# The listen lines must match how the box's other vhosts listen, because
# nginx picks a server block by address first and then only among blocks
# with that exact address:
# - 443: every vhost listens on the box IP (169.58.2.239:443), so a bare
#   `listen 443` would never be chosen. Name the IP here too.
# - 80: every vhost listens on 0.0.0.0:80. A `listen <IP>:80` here would take
#   ALL plain-HTTP requests to that IP, breaking the other sites' HTTP→HTTPS
#   redirects and certificate renewals. Keep it a bare `listen 80`.
# Check with:  ss -ltnp | grep nginx
#
# Test before reloading:  nginx -t && systemctl reload nginx

# Only Cloudflare may reach the origin. This is decided on the CONNECTING
# address ($realip_remote_addr), not $remote_addr: the realip settings below
# replace $remote_addr with the visitor's IP from CF-Connecting-IP, so an
# allow/deny on $remote_addr would see the visitor and refuse everyone.
# Ranges from https://www.cloudflare.com/ips/ (deploy/cloudflare-ips.txt).
geo $realip_remote_addr $ruthsmarriage_from_cloudflare {
    default 0;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    108.162.192.0/18 1;
    131.0.72.0/22 1;
    141.101.64.0/18 1;
    162.158.0.0/15 1;
    172.64.0.0/13 1;
    173.245.48.0/20 1;
    188.114.96.0/20 1;
    190.93.240.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    # Both ports, so it works whatever the zone's SSL mode is (Flexible
    # connects on 80, Full / Full (strict) on 443).
    listen 80;
    listen 169.58.2.239:443 ssl;
    server_name ruthsmarriage.com www.ruthsmarriage.com vps.ruthsmarriage.com;

    # Cloudflare Origin Certificate (SSL/TLS → Origin Server), for
    # ruthsmarriage.com and *.ruthsmarriage.com.
    ssl_certificate     /etc/ssl/ruthsmarriage/origin.pem;
    ssl_certificate_key /etc/ssl/ruthsmarriage/origin.key;

    # The visitor's IP, for the logs and the app.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    if ($ruthsmarriage_from_cloudflare = 0) {
        return 403;
    }

    # One address: www goes to the apex, path and query kept.
    if ($host = www.ruthsmarriage.com) {
        return 301 https://ruthsmarriage.com$request_uri;
    }

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:4322;
        proxy_http_version 1.1;
        # The site builds its own URLs from the Host header.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Passed through as sent by Cloudflare; trustworthy only because of
        # the Cloudflare-only check above (trustedProxyHeaders in astro.config.mjs).
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
